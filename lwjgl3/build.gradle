plugins { id 'application' }

java {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
  main { resources { srcDirs = [rootProject.file('assets')] } }
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.14.2"
  implementation "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:1.14.2:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:1.14.2:natives-desktop"
}

application { mainClass = 'com.delmartec.projectorb.lwjgl3.Lwjgl3Launcher' }

tasks.named('run') { workingDir = rootProject.file('assets') }

// Checagens automatizadas (programas main() em src/test): 
//   gradlew :lwjgl3:runCheck -Pcheck=QuizCheck
tasks.register('runCheck', JavaExec) {
  dependsOn 'testClasses'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.delmartec.projectorb.lwjgl3.' + (project.findProperty('check') ?: 'VisualSmokeLauncher')
  workingDir = rootProject.file('assets')
  if (project.hasProperty('checkArgs')) jvmArgs(project.property('checkArgs').toString().split(' '))
}
